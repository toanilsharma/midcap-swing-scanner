name: Telegram Command Listener

on:
  schedule:
    - cron: "*/15 * * * *"  # Every 15 minutes
  workflow_dispatch:

concurrency:
  group: "telegram-listener"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process pending Telegram commands (ONESHOT)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONESHOT: "1"
        run: |
          python main.py --poll

      - name: Commit and push trade journal updates
        run: |
          staged=0
          for f in trades.json open_positions.json alert_settings.json tg_offset.txt; do
            if [ -f "$f" ]; then
              git add "$f"
              staged=1
            fi
          done

          if [ "$staged" -eq 0 ]; then
            echo "No state files present to stage; nothing to commit."
            exit 0
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: sync listener state [skip ci]"

          git pull --rebase origin main || echo "Warning: git pull --rebase failed, continuing to push"

          if ! git push origin main; then
            echo "Initial push failed, retrying after 3 seconds..."
            sleep 3
            git pull --rebase origin main || true
            git push origin main
          fi
