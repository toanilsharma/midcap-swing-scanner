name: Daily Midcap Scan

on:
  schedule:
    # Multiple jittered, non-congested schedules avoid peak queue traffic at :00, :15, :30, :45:
    - cron: "08 10 * * 1-5"  # 10:08 UTC = 15:38 IST (8 mins after NSE 15:30 close)
    - cron: "23 10 * * 1-5"  # 10:23 UTC = 15:53 IST (Standard evening run)
    - cron: "41 10 * * 1-5"  # 10:41 UTC = 16:11 IST (Backup evening run)
    - cron: "07 11 * * 1-5"  # 11:07 UTC = 16:37 IST (Late backup run)
    - cron: "36 11 * * 1-5"  # 11:36 UTC = 17:06 IST (Safety net run)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_ALERT: "1"
          SKIP_GIT_PUSH: "1"
        run: |
          python main.py

      - name: Append daily OHLCV snapshot
        continue-on-error: true
        run: |
          python archive_writer.py

      - name: Fetch NSE bulk/block + delivery
        run: |
          python fetch_deals.py

      - name: Auto-commit scan results and deals
        env:
          SKIP_GIT_PUSH: "0"
        run: |
          python -c "import main; main.git_commit_scan_results()"

