name: Daily Midcap Scan

on:
  schedule:
    # Multiple staggered schedules prevent missed/delayed runs during GitHub peak queue loads:
    - cron: "15 10 * * 1-5"  # 10:15 UTC = 15:45 IST (15 mins after NSE 15:30 close)
    - cron: "45 10 * * 1-5"  # 10:45 UTC = 16:15 IST (Standard scheduled run)
    - cron: "15 11 * * 1-5"  # 11:15 UTC = 16:45 IST (Backup safety-net run)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_ALERT: "1"
          SKIP_GIT_PUSH: "1"
        run: |
          python main.py

      - name: Append daily OHLCV snapshot
        continue-on-error: true
        run: |
          python archive_writer.py

      - name: Fetch NSE bulk/block + delivery
        run: |
          python fetch_deals.py

      - name: Auto-commit scan results and deals
        env:
          SKIP_GIT_PUSH: "0"
        run: |
          python -c "import main; main.git_commit_scan_results()"

