<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2d"/>
      <stop offset="100%" stop-color="#0e1017"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <!-- Grid Lines -->
  <line x1="70" y1="170" x2="442" y2="170" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="70" y1="265" x2="442" y2="265" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="70" y1="360" x2="442" y2="360" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" stroke-dasharray="6,6"/>
  <!-- Candle 1 (Green) -->
  <line x1="150" y1="200" x2="150" y2="390" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>
  <rect x="134" y="240" width="32" height="95" rx="6" fill="#10B981"/>
  <!-- Candle 2 (Pullback indigo) -->
  <line x1="245" y1="250" x2="245" y2="400" stroke="#6366F1" stroke-width="6" stroke-linecap="round"/>
  <rect x="229" y="275" width="32" height="85" rx="6" fill="#6366F1"/>
  <!-- Candle 3 (Breakout green) -->
  <line x1="340" y1="120" x2="340" y2="330" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>
  <rect x="324" y="150" width="32" height="120" rx="6" fill="#10B981"/>
  <!-- Trendline curve -->
  <path d="M 100 370 Q 230 340 330 190 T 430 115" fill="none" stroke="url(#chartLine)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Peak Dot -->
  <circle cx="430" cy="115" r="14" fill="#10B981" filter="url(#glow)"/>
  <circle cx="430" cy="115" r="7" fill="#ffffff"/>
</svg>
