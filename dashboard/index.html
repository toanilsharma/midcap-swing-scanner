<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Midcap Swing Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-icon">📈</div>
    <h1 class="login-title">Midcap Swing Dashboard</h1>
    <p class="login-subtitle">Private Portfolio & Scanner Terminal</p>

    <form id="loginForm" class="login-form">
      <div class="input-group">
        <label for="password">Access Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Enter password" 
          autocomplete="current-password"
          required
        >
      </div>

      <div id="loginError" class="login-error" style="display: none;">
        Wrong password. Please try again.
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
        Sign In
      </button>
    </form>
  </div>

  <script src="app.js"></script>
  <script src="login.js"></script>
</body>
</html>
